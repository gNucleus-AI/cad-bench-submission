package: gnucleus-ai/cad-bench
name: v3
title: Parametric CAD Bench v3
description: >-
  Held-out Parametric CAD Bench v3 results across 30 text-to-CAD creation,
  30 text-to-CAD create-and-edit, and 40 image-to-CAD tasks. Ranking uses the
  mean continuous reward across all 100 tasks; failed or unscored trials count
  as zero.
visibility: public
dataset_version_refs:
  - v3

metadata_schema:
  type: object
  required: [agent_display, model_display, agent_name, model_name, reasoning_effort, agent_version, harbor_version, auth_mode, run_date, benchmark_tag, dataset_digest, config_sha256, job_display]
  properties:
    agent_display: &link
      type: object
      required: [label, url]
      properties:
        label: {type: string, minLength: 1}
        url: {type: string, format: uri}
      additionalProperties: false
    model_display: *link
    job_display: *link
    agent_name: {type: string, minLength: 1}
    model_name: {type: string, minLength: 1}
    reasoning_effort: {type: string, minLength: 1}
    agent_version: {type: string, minLength: 1}
    harbor_version: {type: string, const: "0.23.0"}
    auth_mode: {type: string, enum: [api-key, subscription, vertex-adc]}
    run_date: {type: string, pattern: '^\d{4}-\d{2}-\d{2}$'}
    benchmark_tag: {type: string, const: v3}
    dataset_digest: {type: string, const: 'sha256:8a786725d3648a76282fc5868df06da3d5e00d603f283573a53430803465d78a'}
    config_sha256: {type: string, pattern: '^[0-9a-f]{64}$'}
  additionalProperties: false

metrics_schema:
  type: object
  required: [mean_reward, ci95_half_width, display_score, create_mean_reward, display_create_score, create_edit_mean_reward, display_create_edit_score, image_to_cad_mean_reward, display_image_to_cad_score, scored_rate, display_scored_rate, perfect_rate, display_perfect_rate, n_trials, n_errors, avg_trial_duration_sec, job_wall_time_sec, known_cost_usd, cost_coverage, display_cost, known_total_tokens, token_coverage, display_tokens]
  properties:
    mean_reward: &reward {type: number, minimum: 0, maximum: 1}
    ci95_half_width: {type: number, minimum: 0}
    display_score: {type: string}
    create_mean_reward: *reward
    display_create_score: {type: string}
    create_edit_mean_reward: *reward
    display_create_edit_score: {type: string}
    image_to_cad_mean_reward: *reward
    display_image_to_cad_score: {type: string}
    scored_rate: {type: number, minimum: 0, maximum: 1}
    display_scored_rate: {type: string}
    perfect_rate: {type: number, minimum: 0, maximum: 1}
    display_perfect_rate: {type: string}
    n_trials: {type: integer, const: 100}
    n_errors: {type: integer, minimum: 0, maximum: 100}
    avg_trial_duration_sec: {type: number, minimum: 0}
    job_wall_time_sec: {type: number, minimum: 0}
    known_cost_usd: {type: number, minimum: 0}
    cost_coverage: {type: number, minimum: 0, maximum: 1}
    display_cost: {type: string}
    known_total_tokens: {type: integer, minimum: 0}
    token_coverage: {type: number, minimum: 0, maximum: 1}
    display_tokens: {type: string}
  additionalProperties: false

columns:
  - {id: agent, header: Agent, accessor: metadata.agent_display, type: link}
  - {id: model, header: Model, accessor: metadata.model_display, type: link}
  - {id: effort, header: Effort, accessor: metadata.reasoning_effort, type: text}
  - {id: score, header: Overall, accessor: metrics.mean_reward, type: number, display_accessor: metrics.display_score, display_type: text, align: right}
  - {id: create, header: Create, accessor: metrics.create_mean_reward, type: number, display_accessor: metrics.display_create_score, display_type: text, align: right}
  - {id: create_edit, header: Create + Edit, accessor: metrics.create_edit_mean_reward, type: number, display_accessor: metrics.display_create_edit_score, display_type: text, align: right}
  - {id: image_to_cad, header: Image-to-CAD, accessor: metrics.image_to_cad_mean_reward, type: number, display_accessor: metrics.display_image_to_cad_score, display_type: text, align: right}
  - {id: scored, header: Scored, accessor: metrics.scored_rate, type: number, display_accessor: metrics.display_scored_rate, display_type: text, align: right}
  - {id: perfect, header: Perfect, accessor: metrics.perfect_rate, type: number, display_accessor: metrics.display_perfect_rate, display_type: text, align: right}
  - {id: avg_runtime, header: Avg sec, accessor: metrics.avg_trial_duration_sec, type: number, align: right}
  - {id: cost, header: Known cost, accessor: metrics.known_cost_usd, type: number, display_accessor: metrics.display_cost, display_type: text, align: right}
  - {id: date, header: Date, accessor: metadata.run_date, type: date}
  - {id: run, header: Run, accessor: metadata.job_display, type: link}

rank_by:
  - {accessor: metrics.mean_reward, direction: desc, nulls: last}
  - {accessor: metrics.scored_rate, direction: desc, nulls: last}
