name: Validate submissions

on:
  pull_request:
    paths:
      - ".github/workflows/validate-submissions.yml"
      - "baselines/**"
      - "benchmarks/**"
      - "cad_bench_submission/**"
      - "frozen/**"
      - "submissions/**"
      - "tests/**"
      - "pyproject.toml"
      - "uv.lock"
  push:
    branches: [main]
    paths:
      - ".github/workflows/validate-submissions.yml"
      - "baselines/**"
      - "benchmarks/**"
      - "cad_bench_submission/**"
      - "frozen/**"
      - "submissions/**"
      - "tests/**"
      - "pyproject.toml"
      - "uv.lock"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Reject changes to the frozen v1 leaderboard
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: uv run python -m cad_bench_submission.freeze --base "$BASE_SHA"
      - name: Verify the frozen v1 snapshot
        if: github.event_name != 'pull_request'
        run: uv run python -m cad_bench_submission.freeze
      - run: uv run python -m cad_bench_submission.validation
      - run: uv run pytest
