# Parametric CAD Bench — example submission manifest.
#
# Copy this file to:
#   submissions/v3/<your-github-handle>-<agent>-<model>.yaml
#
# Validated against submissions/_schema/manifest-v3.schema.json by a
# maintainer on every PR. Declared mean_reward and n_errors are checked
# against the audited artifacts. cost_usd is informational; the row uses
# recorded costs or an independent complete cost audit.

schema_version: 3

submission:
  version: 1
  submitted_at: "2026-11-04"

contributor:
  handle: "octocat"
  org: "Example Robotics"            # optional
  email: "octocat@example.com"       # optional

bench:
  dataset: "gnucleus-ai/cad-bench"
  tag: "v3"
  # Exact immutable digest resolved from gnucleus-ai/cad-bench@v3.
  dataset_content_hash: "sha256:8a786725d3648a76282fc5868df06da3d5e00d603f283573a53430803465d78a"

agent:
  name: "codex"                      # short slug
  display_name: "Codex"
  display_url: "https://openai.com/codex/"
  version: "1.4.2"
  reasoning_effort: "max"
  auth_mode: "api-key"
  import_path: ""                    # optional, for custom Harbor adapters

model:
  id: "openai/gpt-5.5"               # LiteLLM-style id used by your runner
  display_name: "GPT-5.5"
  display_url: "https://developers.openai.com/api/docs/models/gpt-5.5"
  endpoint: ""                       # optional, only if non-default

results:
  # This job and all 100 trials must be publicly readable.
  source_jobs:
    - "https://hub.harborframework.com/jobs/01234567-89ab-cdef-0123-456789abcdef"
  source_filter:
    agent: "codex"
    agent_version: "1.4.2"
    model: "openai/gpt-5.5"
    reasoning_effort: "max"
  # Optional redundant archive. Harbor source_jobs remain authoritative.
  hf_archive:
    repo: "octocat/cad-bench-results"
    commit_oid: "0123456789abcdef0123456789abcdef01234567"
    runs_prefix: "runs/codex/openai-gpt-5_5/"

declared:
  mean_reward: 0.832
  trials_per_task: 1
  total_trials: 100
  n_errors: 0
  cost_usd: 170.00                   # optional; Harbor-recorded or independently audited

notes: |
  Example only: replace all metadata and scores with your actual v3 run.
  Harbor 0.23.0, one attempt per task, zero retries. Describe any multimodal
  adapter or system-prompt modifications here.
