notes: |
  Grok 4.6 via Grok Build 0.2.52, run against
  gnucleus-ai/cad-bench@v1 with one trial per task and four concurrent
  trials. The agent used high reasoning effort with no explicit turn,
  dollar, token, or thinking-token cap. Harbor used a persistable one-year
  timeout in place of infinity; no trial timed out.

  Per-axis means over 100 tasks: geometry_similarity 0.834858,
  cad_spec_consistency 0.971610, combined 0.878407. The ACP adapter exposes
  only final-response token counters, so full-session usage was reconstructed
  from the complete trajectories with the o200k_base tokenizer: approximately
  87,858,922 input tokens, including 83,714,743 cached tokens, and 3,180,516
  output/reasoning tokens across 2,307 model calls. cost_usd applies the
  published Grok 4.6 prices of $2/M uncached input, $0.50/M cached input, and
  $6/M output to those reconstructed counts; it is therefore an estimate.

  HARBOR COMPATIBILITY. The ACP adapter routes Grok Build's model requests
  through an OpenAI-compatible endpoint without changing prompts or model
  responses. NumericRewardVerifier removes descriptive string fields from
  reward.json before Pydantic validates the numeric reward mapping. It does
  not alter task-produced rewards or any score.

  PUBLICATION SANITIZATION. Private routing identifiers were replaced with
  the announced public model name. Credentials, local home-directory paths,
  and runtime UUIDs were redacted from text artifacts. Prompts, commands,
  answers, FCStd files, and rewards were otherwise unchanged.
