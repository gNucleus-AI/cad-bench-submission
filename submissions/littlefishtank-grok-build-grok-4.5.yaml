notes: |
  Grok 4.5 via Grok Build, run against gnucleus-ai/cad-bench@v1 with
  one trial per task and four concurrent trials. The agent used its default
  high reasoning mode with no explicit thinking-token cap. Harbor used a
  persistable one-year timeout in place of infinity; no trial timed out.

  Per-axis means over 100 tasks: geometry_similarity 0.802323,
  cad_spec_consistency 0.940637, combined 0.837076. Nested ACP usage totals:
  3,855,839 input tokens, including 3,631,488 cached tokens; 20,886 visible
  output tokens; and 11,921 reasoning tokens. The declared cost applies xAI's
  published standard Grok 4.5 rates to those totals: $2/M uncached input,
  $0.30/M cached input, and $6/M output/reasoning tokens. Harbor's ACP adapter
  did not populate result.json cost_usd directly.

  HARBOR COMPATIBILITY. The run used NumericRewardVerifier, a subclass of
  Harbor's standard verifier that removes the descriptive string fields from
  reward.json before Pydantic validates the numeric reward mapping. It does
  not alter the task-produced reward files or any score.

  PUBLICATION SANITIZATION. Credentials, local home-directory paths, and
  runtime UUIDs were redacted from text artifacts. Non-selected private model
  names in the agent's available-model catalogue were normalized or redacted.
  The active model remains grok-4.5; prompts, commands, answers, FCStd files,
  and rewards were not changed.
